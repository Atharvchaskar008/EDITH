<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDITH</title>
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<header><h1>EDITH</h1><a href="/landing">Story</a></header>

<div class="tiles">
  <div><b id="t-objects">-</b><span>objects watched</span></div>
  <div><b id="t-passes">-</b><span>close passes ahead</span></div>
  <div><b id="t-red">-</b><span>dangerous</span><span id="t-rest" class="sub"></span></div>
  <div><b id="t-burns">-</b><span>burns ready</span></div>
</div>

<div class="run"><button id="run">Run now</button><span id="status"></span></div>
<p class="check"><span id="validation"></span> <a id="report" href="#proof-title" hidden>Proof</a></p>

<div class="split">
  <div id="planbox"><h2>Plan</h2><div id="plan"><p class="why">Pick a pass.</p></div></div>
  <div>
    <h2>Close passes <span class="tabs"><a id="showPriority" class="on">Priority</a><a id="showLatest">All</a><a id="showBurns">With a plan</a><a id="showFleets">Fleets</a><a id="showReplay">2009 replay</a></span></h2>
    <div class="find"><input id="q" placeholder="Check any satellite: name or number" autocomplete="off"><ul id="found"></ul><p id="about" class="why"></p></div>
    <table>
      <thead id="head"></thead>
      <tbody id="events"></tbody>
    </table>
  </div>
</div>

<h2>What changed</h2>
<ul id="alerts"><li>Nothing yet.</li></ul>

<h2 id="proof-title" hidden>Proof <span class="tabs"><a id="full-report" target="_blank" hidden>Full report</a></span></h2>
<div id="proof" class="proof" hidden></div>
<div id="error"></div>

<script src="/static/dashboard.js"></script>
</body>
</html>
