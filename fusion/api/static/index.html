<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDITH</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 clamp(16px, 4vw, 56px) 56px; background: #000; color: #fff; font: 16px/1.5 "Helvetica Neue", "Segoe UI", Arial, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; border-bottom: 1px solid #262626; }
  h1 { margin: 0; font-size: 28px; letter-spacing: .3em; }
  header a, .tabs a, .check a { color: #fff; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid #fff; cursor: pointer; }
  h2 { margin: 36px 0 12px; font-size: 12px; font-weight: 400; letter-spacing: .2em; text-transform: uppercase; color: #9a9a9a; display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; }
  .tabs { display: flex; gap: 18px; }
  .tabs a { border-bottom-color: transparent; color: #9a9a9a; }
  .tabs a.on { color: #fff; border-bottom-color: #fff; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid #262626; }
  .tiles div { padding: 26px 0; }
  .tiles b { display: block; font-size: clamp(34px, 5.4vw, 76px); line-height: 1; letter-spacing: -.03em; }
  .tiles span, .facts span { color: #9a9a9a; font-size: 14px; }
  .run { display: flex; align-items: center; gap: 18px; padding: 22px 0 0; }
  button { background: #fff; color: #000; border: 0; padding: 13px 24px; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  #status, .check { color: #9a9a9a; }
  .check { margin: 10px 0 0; font-size: 14px; }
  #planbox { position: sticky; top: 0; background: #000; border-bottom: 1px solid #fff; padding-bottom: 18px; z-index: 2; }
  #planbox h2 { margin-top: 22px; }
  .big { font-size: clamp(24px, 3.2vw, 44px); font-weight: 600; letter-spacing: -.02em; line-height: 1.1; margin: 0; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .facts b { display: block; font-size: 18px; }
  .why { color: #9a9a9a; margin: 14px 0 0; max-width: 90ch; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: #9a9a9a; font-weight: 400; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  th, td { padding: 10px 10px 10px 0; border-bottom: 1px solid #1c1c1c; }
  tr.row { cursor: pointer; }
  tr.row:hover, tr.picked { background: #161616; }
  .RED { font-weight: 700; } .AMBER { color: #cfcfcf; } .GREEN { color: #6f6f6f; }
  .tag { border: 1px solid #fff; padding: 1px 7px; font-size: 11px; letter-spacing: .12em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 9px 0; border-bottom: 1px solid #1c1c1c; color: #cfcfcf; }
  #error { font-weight: 700; margin-top: 18px; }
  @media (max-width: 760px) { .tiles, .facts { grid-template-columns: repeat(2, 1fr); } .hide { display: none; } }
</style>
</head>
<body>
<header><h1>EDITH</h1><a href="/landing">Story</a></header>

<div class="tiles">
  <div><b id="t-objects">-</b><span>objects watched</span></div>
  <div><b id="t-passes">-</b><span>close passes ahead</span></div>
  <div><b id="t-red">-</b><span>dangerous</span></div>
  <div><b id="t-burns">-</b><span>moves planned</span></div>
</div>

<div class="run"><button id="run">Run now</button><span id="status">Ready.</span></div>
<p class="check"><span id="validation"></span> <a id="report" href="#" target="_blank" hidden>Proof</a></p>

<div id="planbox"><h2>Plan</h2><div id="plan"><p class="why">Pick a pass below.</p></div></div>

<h2>Close passes <span class="tabs"><a id="showLatest" class="on">All</a><a id="showBurns">With a plan</a><a id="showReplay">2009 replay</a></span></h2>
<table>
  <thead><tr><th>Level</th><th>Objects</th><th class="hide">In</th><th>Distance</th><th>Risk</th><th>Plan</th></tr></thead>
  <tbody id="events"></tbody>
</table>

<h2>What changed</h2>
<ul id="alerts"><li>Nothing yet.</li></ul>
<div id="error"></div>

<script>
const $ = id => document.getElementById(id);
let picked = null, runId = null, source = "latest", onlyBurns = false;
const get = async path => { const r = await fetch(path); if (!r.ok) throw new Error(path); return r.json(); };
const n = x => Number(x).toLocaleString("en-US");
const esc = s => String(s == null ? "" : s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const odds = p => p == null ? "-" : p >= 0.5 ? "likely" : 1 / p > 1e9 ? "under 1 in a billion" : "1 in " + n(Math.round(1 / p));
const dist = km => km < 1 ? Math.round(km * 1000) + " m" : km.toFixed(2) + " km";
const word = level => level ? level[0] + level.slice(1).toLowerCase() : "";
const fail = () => { $("error").textContent = "Cannot reach the system."; };

async function loadTop() {
  const r = await get("/latest");
  $("t-objects").textContent = n(r.screen.objects_screened);
  $("t-passes").textContent = n(r.events);
  $("t-red").textContent = n(r.levels.RED);
  $("t-burns").textContent = n(r.plans.maneuver);
  $("error").textContent = "";
  try {
    const v = await get("/validation");
    $("validation").textContent = "Checked against CelesTrak: distances match to " + v.same_input.all_matches.miss_difference_m.median.toFixed(2) + " m.";
    if (v.report) { $("report").hidden = false; $("report").href = "/addons/files/" + v.report; }
  } catch (e) { $("validation").textContent = ""; }
}

async function loadEvents() {
  const events = await get("/events?limit=60&source=" + source + (onlyBurns ? "&plan=MANEUVER" : ""));
  $("events").innerHTML = events.map(e => {
    const hours = source === "latest" ? Math.max(0, (new Date(e.tca) - Date.now()) / 3.6e6).toFixed(1) + " h" : "-";
    const plan = e.plan_decision === "MANEUVER" ? "<b>Move</b>" : e.plan_decision === "MONITOR" ? "Watch" : "";
    return `<tr class="row ${e.event_id === picked ? "picked" : ""}" data-id="${esc(e.event_id)}">
      <td class="${e.risk_level}">${word(e.risk_level)}</td>
      <td>${esc(e.primary_name)} / ${esc(e.secondary_name)}${e.synthetic ? ' <span class="tag">TEST</span>' : ""}</td>
      <td class="hide">${hours}</td><td>${dist(e.miss_distance_km)}</td><td>${odds(e.pc_max)}</td><td>${plan}</td></tr>`;
  }).join("") || '<tr><td colspan="6">Nothing to show.</td></tr>';
  document.querySelectorAll("tr.row").forEach(row => row.onclick = () => { picked = row.dataset.id; loadEvents().catch(fail); loadPlan(); });
}

function burn(p) {
  const way = p.dv_rtn_ms[1] > 0 ? "Speed up" : "Slow down";
  return `<p class="big">${way} by ${(p.dv_magnitude_ms * 1000).toFixed(0)} mm/s</p>
    <div class="facts">
      <div><b>${p.lead_time_orbits} orbits early</b><span>when</span></div>
      <div><b>${dist(p.miss_before_km)} to ${dist(p.miss_after_km)}</b><span>distance</span></div>
      <div><b>${odds(p.pc_max_before)} to ${odds(p.pc_max_after)}</b><span>risk</span></div>
      <div><b>${p.secondary_conjunctions_created}</b><span>new dangers</span></div>
    </div><p class="why">${esc(p.rationale)}</p>`;
}

async function loadPlan() {
  if (!picked) return;
  try {
    const p = await get("/events/" + encodeURIComponent(picked) + "/plan?source=" + source);
    if (p.decision === "MANEUVER") { $("plan").innerHTML = burn(p); return; }
    let html = `<p class="big">${p.decision === "MONITOR" ? "Watch" : "No action"}</p><p class="why">${esc(p.rationale)}</p>`;
    if (source === "replay") {
      const whatIf = (await get("/replay/2009")).what_if_plans.find(w => w.event_id === picked);
      if (whatIf) html += "<h2>What if it had moved</h2>" + burn(whatIf);
    }
    $("plan").innerHTML = html;
  } catch (e) { $("plan").innerHTML = '<p class="big">Safe</p><p class="why">Low risk. No plan needed.</p>'; }
}

async function loadAlerts() {
  const alerts = await get("/alerts?severity=CRITICAL&limit=5");
  $("alerts").innerHTML = alerts.map(a => `<li>${esc(a.message)}</li>`).join("") || "<li>Nothing new.</li>";
}

function refresh() { loadTop().catch(fail); loadEvents().catch(fail); loadAlerts().catch(() => {}); }

$("run").onclick = async () => {
  $("run").disabled = true;
  $("status").textContent = "Starting...";
  try {
    const r = await fetch("/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ synthetic: false, quick: true, mode: null }) });
    runId = (await r.json()).run_id;
  } catch (e) { $("run").disabled = false; fail(); }
};

async function poll() {
  if (!runId) return;
  const s = await get("/run/" + runId + "/status");
  const last = s.log.length ? s.log[s.log.length - 1].message : s.stage;
  $("status").textContent = s.status === "RUNNING" ? last : s.status === "DONE" ? "Done. " + last : "Failed. " + (s.error || "");
  if (s.status !== "RUNNING") { runId = null; $("run").disabled = false; refresh(); }
}

function show(which, burns, tab) {
  source = which; onlyBurns = burns; picked = null;
  $("plan").innerHTML = '<p class="why">Pick a pass below.</p>';
  ["showLatest", "showBurns", "showReplay"].forEach(id => $(id).classList.toggle("on", id === tab));
  loadEvents().catch(fail);
}
$("showLatest").onclick = () => show("latest", false, "showLatest");
$("showBurns").onclick = () => show("latest", true, "showBurns");
$("showReplay").onclick = () => show("replay", false, "showReplay");

setInterval(() => poll().catch(fail), 2000);
setInterval(() => { if (!runId) refresh(); }, 20000);
refresh();
</script>
</body>
</html>
